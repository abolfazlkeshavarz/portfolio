services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: abolfazl-portfolio:${IMAGE_TAG:-latest}
    container_name: abolfazl-portfolio
    restart: unless-stopped
    # Published on loopback only: the host's nginx terminates TLS and proxies
    # here, so this port is never reachable from the internet directly.
    ports:
      - '127.0.0.1:${APP_HTTP_PORT:-8093}:80'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
