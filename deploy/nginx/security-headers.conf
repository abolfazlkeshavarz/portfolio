# Installed on the host as /etc/nginx/snippets/portfolio-security-headers.conf
# by scripts/deploy-host-nginx.sh. Named per-project so it never clashes with
# another site's snippet on a shared server.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# The site is self-contained apart from Google Fonts (stylesheet + font files).
# 'unsafe-inline' for styles covers the inline style attributes React writes
# for the 3D tilt transforms.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
