# nginx config INSIDE the app container. TLS, HSTS and the public hostname
# are the host nginx's job (deploy/nginx/app.conf.template); this server only
# hands out the built files on a local port.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The host proxy sets X-Forwarded-For; log the real client, not the proxy.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # Vite fingerprints every asset filename, so these can be cached hard.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:jpg|jpeg|png|webp|avif|svg|ico|woff2|pdf)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html must never be cached, or a deploy leaves browsers pointing at
    # asset filenames that no longer exist.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
